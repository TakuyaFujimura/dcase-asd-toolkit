# @package _global_
# Three base backends for global pooling; Rescale only for CLS and time-average BEAM.
backend:
  - _target_: asdkit.backends.TransformWrapper
    view_name: global_pooled
    pooling_name: mean
    backend_cfg: &knn
      _target_: asdkit.backends.KnnBackend
      n_neighbors: 1
      metric: cosine
  - _target_: asdkit.backends.TransformWrapper
    view_name: global_pooled
    pooling_name: mean
    backend_cfg: &smote
      _target_: asdkit.backends.KnnSMOTEBackend
      n_neighbors: 1
      metric: cosine
      smote_ratio: 0.2
      smote_neighbors: 2
  - _target_: asdkit.backends.TransformWrapper
    view_name: global_pooled
    pooling_name: mean
    backend_cfg: &rescale
      _target_: asdkit.backends.KnnRescaleBackend
      n_neighbors: 1
      metric: cosine
      k_ref_normalize: 4
  - _target_: asdkit.backends.TransformWrapper
    view_name: cls
    backend_cfg: *rescale
  - _target_: asdkit.backends.BEAM
    backend_cfg: *rescale
