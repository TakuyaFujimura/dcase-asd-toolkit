_target_: asdkit.frontends.PretrainedDisPLFrontend

optim_cfg:
  _target_: torch.optim.AdamW
  lr: 1.0e-4

lrscheduler_cfg: null

label_dict_path: ${label_dict_path}

model_cfg:
  extractor_cfg:
    _target_: asdkit.models.pretrained_models.wrapper.PretrainedWrapper
    model_cfg:
      _target_: asdkit.models.pretrained_models.beats.BEATsSSLModel
      model_id: "BEATs_iter3"
      sr: ${datamodule.sr}
      spectrogram_augmentation_cfg: null
    adaptation_cfg:
      _target_: asdkit.models.pretrained_models.adaptation.LoRA
      lora_cfg:
        r: 64
        target_modules: ["q_proj", "v_proj"]
  embedding_head_cfg:
    _target_: asdkit.models.pretrained_models.heads.AttnStatPoolHead
    embedding_dim: 256
  head_input_mode: seq
  loss_cfg: {}
  label_loss_weight_dict:
    main: 1
  augmentation_cfg_list: []
