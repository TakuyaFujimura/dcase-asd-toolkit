name: Format

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          python-version: "3.10"
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure
