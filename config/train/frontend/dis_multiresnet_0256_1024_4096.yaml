_target_: asdkit.frontends.BasicDisPLFrontend

optim_cfg:
  _target_: torch.optim.AdamW
  lr: 1.0e-3

lrscheduler_cfg: null

label_dict_path: ${label_dict_path}

model_cfg:
  extractor_cfg:
    _target_: asdkit.models.multiresnet.MultiResNet
    sec: ${datamodule.sec}
    sr: ${datamodule.sr}
    use_fft: true
    stft_cfg_list:
      -
        sr: ${datamodule.sr}
        n_fft: 256
        hop_length: 128
        n_mels: null
        power: 1.0
        f_min: 200.0
        f_max: 8000.0
        temporal_norm: false
      -
        sr: ${datamodule.sr}
        n_fft: 1024
        hop_length: 512
        n_mels: null
        power: 1.0
        f_min: 200.0
        f_max: 8000.0
        temporal_norm: false
      -
        sr: ${datamodule.sr}
        n_fft: 4096
        hop_length: 2048
        n_mels: null
        power: 1.0
        f_min: 200.0
        f_max: 8000.0
        temporal_norm: false
    use_bias: false
    emb_base_size: 128
    fft_network_cfg:
      _target_: asdkit.models.multiresnet.fft_encoder_networks.Conv1dEncoderLayer
      aggregate: "mlp"
    stft_network_cfg:
      _target_: asdkit.models.multiresnet.stft_encoder_networks.Conv2dEncoderLayer
      resnet_additional_layer: "SEBlock"
      aggregate: "mlp"
  loss_cfg: {}
  label_loss_weight_dict:
    main: 1
  augmentation_cfg_list:
    - _target_: asdkit.augmentations.Mixup
      prob: 0.5
