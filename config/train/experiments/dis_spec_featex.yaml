# @package _global_
defaults:
  - override /datamodule: basic
  - override /frontend: dis_multiresnet_1024
  - override /trainer: default


label_dict_path:
  main: "labels/${dcase}/main.json"

model_ver: "all"

frontend:
  _target_: asdkit.frontends.FeatExPLFrontend
  model_cfg:
    loss_cfg:
      _target_: asdkit.losses.SubClusterAdaCos
      n_subclusters: 16
      dynamic: false
      trainable: false
    subspace_embedding_dim: ${frontend.model_cfg.extractor_cfg.emb_base_size}
    featex_loss_weight: 1.0
    featex_prob: 0.5
