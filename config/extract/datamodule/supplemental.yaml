supplemental:
  dataloader:
    batch_size: 64
    num_workers: 0
    pin_memory: false
    shuffle: false
  dataset:
    _target_: asdkit.datasets.WaveDataset
    path_selector_list:
      - "${data_dir}/formatted/${dcase}/raw/${machine}/supplemental/*.wav"
  batch_sampler: null
  collator:
    _target_: asdkit.datasets.DCASEWaveCollator
    label_dict_path: {}
    sec: ${sec}
    sr: 16000
    shuffle: false
    metadata_keys: []
