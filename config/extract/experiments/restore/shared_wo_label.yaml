# @package _global_
restore_or_scratch: restore
restore_model_ver: "all"
restore_ckpt_ver: ${infer_ver}
infer_ver: null

datamodule:
  train:
    collator:
      tgt_class: "asdkit.datasets.DCASEWaveCollator"
