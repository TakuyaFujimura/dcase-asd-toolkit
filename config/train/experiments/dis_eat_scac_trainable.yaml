# @package _global_
defaults:
  - override /datamodule: basic
  - override /frontend: dis_eat
  - override /trainer: default


label_dict_path:
  main: "labels/${dcase}/main.json"

model_ver: "all"

trainer:
  max_epochs: 25

datamodule:
  batch_size: 8

frontend:
  save_only_trainable: true
  model_cfg:
    extractor_cfg:
      model_cfg:
        model_id: "worstchan/EAT-base_epoch30_pretrain"
    loss_cfg:
      _target_: asdkit.losses.SubClusterAdaCos
      n_subclusters: 16
      dynamic: false
      trainable: true
    augmentation_cfg_list:
      - _target_: asdkit.augmentations.Mixup
        prob: 0.5
  optim_cfg:
    _target_: torch.optim.AdamW
    lr: 1.0e-4
  lrscheduler_cfg:
    _target_: timm.scheduler.CosineLRScheduler
    t_initial: 5001
    lr_min: ${frontend.optim_cfg.lr}
    warmup_t: 5000
    warmup_lr_init: 0
