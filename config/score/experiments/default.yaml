# @package _global_
backend:
  - _target_: asdkit.backends.KnnBackend
    n_neighbors: 1
  - _target_: asdkit.backends.KnnSMOTEBackend
    n_neighbors: 1
    smote_ratio: 0.2
    smote_neighbors: 2
    metric: cosine
  - _target_: asdkit.backends.KnnRescaleBackend
    n_neighbors: 1
    k_ref_normalize: 4
    metric: cosine
