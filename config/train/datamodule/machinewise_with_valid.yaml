
batch_size: 64
sr: 16000
sec: ${dcase}_${machine}
num_workers: 6


train:
  dataloader:
    batch_size: ${datamodule.batch_size}
    num_workers: ${datamodule.num_workers}
    pin_memory: true
    shuffle: true
  dataset:
    _target_: asdkit.datasets.WaveDataset
    path_selector_list:
      - "${data_dir}/formatted/${dcase}/raw/${machine}/train/*.wav"
  batch_sampler: null
  collator:
    _target_: asdkit.datasets.DCASEWaveCollator
    sr: ${datamodule.sr}
    sec: ${datamodule.sec}
    shuffle: true
    label_dict_path: ${label_dict_path}


valid:
  dataloader:
    batch_size: ${datamodule.batch_size}
    num_workers: ${datamodule.num_workers}
    pin_memory: true
    shuffle: false
  dataset:
    _target_: asdkit.datasets.WaveDataset
    path_selector_list:
      - "${data_dir}/formatted/${dcase}/raw/${machine}/test/*.wav"
  batch_sampler: null
  collator:
    _target_: asdkit.datasets.DCASEWaveCollator
    sr: ${datamodule.sr}
    sec: ${datamodule.sec}
    shuffle: false
    label_dict_path: ${label_dict_path}

