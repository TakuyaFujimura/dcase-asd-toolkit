# @package _global_
defaults:
  - override /datamodule: consecutive_stft_frames
  - override /frontend: ae_mlp_melframes
  - override /trainer: default

label_dict_path: {}

frontend:
  use_precomputed_features_for_training: true
  model_cfg:
    frame_shift: 1

callback:
  callbacks:
    interval:
      every_n_epochs: 10

trainer:
  max_epochs: 50
  devices: [0]

model_ver: ${machine}
